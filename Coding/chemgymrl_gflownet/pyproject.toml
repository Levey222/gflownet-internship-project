[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chemgymrl-gflownet"
version = "0.1.0"
description = "Project-owned bridge between ChemGymRL and the local GFlowNet implementation"
requires-python = ">=3.10,<3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

